# Builds the native apps: macOS (.dmg, Apple Silicon + Intel), Windows (.exe installer and .msi) and Android (.apk).
# On pushes to main it only checks that they build. The release workflow calls it with a tag, and the files are then
# attached to that GitHub release. The Android APK is signed only when the ANDROID_KEYSTORE secrets exist.
name: native
on:
  push:
    branches: [main]
    paths: ['native/**', 'client/**', 'shared/**', '.github/workflows/native.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      ANDROID_KEYSTORE:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            args: --target universal-apple-darwin --bundles dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            name: windows
            args: --bundles nsis,msi
            targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.targets }}' }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: native/src-tauri }
      - run: npm ci
      - run: npm run build
      - name: build ${{ matrix.name }}
        working-directory: native
        run: npx tauri build ${{ matrix.args }}
      - name: collect
        shell: bash
        run: |
          v="${{ inputs.tag }}"; v="${v:-dev}"
          mkdir -p out
          if [ "${{ matrix.name }}" = mac ]; then
            cp native/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/chats-desktop-$v-mac.dmg"
          else
            cp native/src-tauri/target/release/bundle/nsis/*.exe "out/chats-desktop-$v-windows-setup.exe"
            cp native/src-tauri/target/release/bundle/msi/*.msi "out/chats-desktop-$v-windows.msi"
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: 'desktop-${{ matrix.name }}', path: out/*, retention-days: 7 }
      - name: attach to release
        if: inputs.tag != ''
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release upload "${{ inputs.tag }}" out/* --clobber

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: android ndk
        run: |
          sdkmanager --install "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: native/src-tauri }
      - run: npm ci
      - run: npm run build
      - name: build apk
        working-directory: native
        run: |
          npx tauri android init --ci
          npx tauri android build --apk --ci
      - name: sign
        id: sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          v="${{ inputs.tag }}"; v="${v:-dev}"
          mkdir -p out
          apk=$(ls native/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.keystore
            "$bt/zipalign" -f -p 4 "$apk" aligned.apk
            "$bt/apksigner" sign --ks release.keystore --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --out "out/chats-android-$v.apk" aligned.apk
            "$bt/apksigner" verify --print-certs "out/chats-android-$v.apk" | head -3
            rm -f release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE secret not set: the APK is unsigned and can't be installed. See native/README.md."
            cp "$apk" "out/chats-android-$v-unsigned.apk"
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*, retention-days: 7 }
      - name: attach to release
        if: inputs.tag != '' && steps.sign.outputs.signed == 'true'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release upload "${{ inputs.tag }}" out/* --clobber

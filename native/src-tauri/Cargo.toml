[package]
name = "chats"
# The release version comes from the repository's package.json (see tauri.conf.json); this one is only for Cargo.
version = "0.0.0"
description = "CHATS for Mac, Windows and Android"
license = "AGPL-3.0-only"
repository = "https://github.com/UltraNomen/CHATS"
edition = "2021"
rust-version = "1.77"

[lib]
name = "chats_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-chats-watch = { path = "plugins/watch" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
